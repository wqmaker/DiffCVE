model:
  target: diffcve.models.video_vae.VideoAutoencoder
  params:
    embed_dim: 4
    fusion_w: 1.0
    ddconfig:
      double_z: true
      num_frames: 5
      z_channels: 4
      resolution: 256
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
